[package]
name = "nm-image-studio-desktop"
version = "1.1.0-alpha.1"
description = "NM Image Studio Windows desktop application"
authors = ["NM Image Studio"]
edition = "2021"

[lib]
name = "nm_image_studio_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.5.1", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "=2.9.2", features = [] }
uuid = { version = "=1.23.1", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }
